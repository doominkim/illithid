name: Release (Windows)

# Builds the Windows installers for a published release, installs each one silently, launches the installed app once,
# then attaches the installers and their SHA-256 sums to the release. The macOS build stays local (scripts/release-mac.sh).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.4.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Native modules (the credential store) come from this machine's architecture
      - run: npm ci
      - name: Version matches the tag
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm run build
      - run: npx electron-builder --win --${{ matrix.arch }} --publish never
      - name: Install silently
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | Select-Object Name, Length | Format-Table
          $p = Start-Process -Wait -PassThru -FilePath "dist\illithid-${{ matrix.arch }}-setup.exe" -ArgumentList '/S','/D=C:\illithid-smoke'
          "installer exit code: $($p.ExitCode)"
          Get-ChildItem C:\illithid-smoke -ErrorAction SilentlyContinue | Select-Object Name | Format-Table
          Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter illithid.exe -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table
      - name: Launch the installed app
        run: npx tsx scripts/smoke-packaged.ts C:\illithid-smoke\illithid.exe
      - uses: actions/upload-artifact@v4
        with:
          name: setup-${{ matrix.arch }}
          path: dist/illithid-${{ matrix.arch }}-setup.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: SHA-256 sums
        working-directory: out
        run: sha256sum illithid-x64-setup.exe illithid-arm64-setup.exe > SHA256SUMS-windows
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$TAG" out/illithid-x64-setup.exe out/illithid-arm64-setup.exe out/SHA256SUMS-windows
          --clobber -R "${{ github.repository }}"
