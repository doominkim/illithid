name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The minimum the README asks for
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Unit tests and fixtures that build their own temp HOME. Fixtures that copy the real library
      # (npm run test:local) stay local
      - run: npm test

  ui-windows:
    # The Electron UI tests on the platform no developer machine checks locally
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ui

  package-windows:
    # Build each installer, install it silently and launch the installed app (the release workflow does the same, then uploads)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --${{ matrix.arch }} --publish never
      - name: Install silently
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe | Select-Object Name, Length | Format-Table
          Get-ChildItem dist\win-*unpacked -Filter illithid* | Select-Object FullName | Format-Table
          $p = Start-Process -Wait -PassThru -FilePath "dist\illithid-${{ matrix.arch }}-setup.exe" -ArgumentList '/S','/D=C:\illithid-smoke'
          "installer exit code: $($p.ExitCode)"
          Get-ChildItem C:\illithid-smoke -ErrorAction SilentlyContinue | Select-Object Name | Format-Table
          Get-ChildItem "$env:LOCALAPPDATA\Programs", "$env:ProgramFiles" -Recurse -Filter illithid.exe -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table
      - name: Launch the installed app
        run: npx tsx scripts/smoke-packaged.ts C:\illithid-smoke\illithid.exe
      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ matrix.arch }}
          path: smoke-failure.png
          if-no-files-found: ignore
