name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runs on the Mac Studio self-hosted runner (GitHub-hosted macOS minutes were the largest Actions cost)
          - os: macos
            runner: [self-hosted, macOS, ARM64, illithid]
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # The minimum the README asks for
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # Unit tests and fixtures that build their own temp HOME. Fixtures that copy the real library
      # (npm run test:local) stay local
      - run: npm test

  ui-windows:
    # The Electron UI tests on the platform no developer machine checks locally
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ui

  package-windows:
    # The x64 installer (ARM PCs run it through Windows' x64 emulation: an arm64 installer left the app's binaries out)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ci-setup-x64
          path: dist/illithid-x64-setup.exe
          if-no-files-found: error
          # Only the smoke jobs below need it; the cleanup job deletes it right after
          retention-days: 1

  smoke-windows:
    # Install the installer silently on x64 and on ARM, and launch the installed app on each
    needs: package-windows
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: ci-setup-x64
          path: dist
      - name: Install silently
        shell: pwsh
        run: |
          $p = Start-Process -Wait -PassThru -FilePath "dist\illithid-x64-setup.exe" -ArgumentList '/S','/D=C:\illithid-smoke'
          "installer exit code: $($p.ExitCode)"
      - name: Launch the installed app
        run: npx tsx scripts/smoke-packaged.ts C:\illithid-smoke\illithid.exe
      - name: Keep the failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-failure-${{ matrix.runner }}
          path: smoke-failure.png
          if-no-files-found: ignore
          retention-days: 3

  cleanup:
    # The 114 MB installer per run filled the account's 0.5 GB Actions storage; drop it once the smoke jobs are done
    needs: smoke-windows
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete this run's installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts"
          --jq '.artifacts[] | select(.name == "ci-setup-x64") | .id'
          | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/{}"
